name: Build macOS Public Beta

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "experiments/**"
      - "ui/**"
      - "integrated_modules/**"
      - "assets/**"
      - "requirements-macos.txt"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-public-beta-release
  cancel-in-progress: true

env:
  RELEASE_TAG: v1.0.0-beta.1
  ARCHIVE_NAME: Pharmacology_CAL_macOS_Public_Beta_v1.0.zip
  CHECKSUM_NAME: Pharmacology_CAL_macOS_Public_Beta_v1.0_SHA256.txt

jobs:
  build:
    # The standard macos-15 image is Apple silicon (arm64).
    runs-on: macos-15

    steps:
      - name: Get source files
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-macos.txt

      - name: Confirm Apple silicon runner
        run: |
          python - <<'PY'
          import platform

          architecture = platform.machine().lower()
          print(f"Building on {platform.platform()} ({architecture})")
          if architecture not in {"arm64", "aarch64"}:
              raise SystemExit("This release is intended for Apple silicon (arm64).")
          PY

      - name: Install pinned build packages
        run: python -m pip install --disable-pip-version-check -r requirements-macos.txt

      - name: Check Python files
        run: python -m compileall -q main.py experiments ui integrated_modules

      - name: Build Mac application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --target-arch arm64 \
            --name "Pharmacology CAL" \
            --osx-bundle-identifier "in.ac.mamc.pharmacology-cal" \
            --icon "assets/mamc_logo.png" \
            --add-data "assets:assets" \
            --collect-submodules "integrated_modules.frog_rectus" \
            --collect-all "tkmacosx" \
            --hidden-import "matplotlib.backends.backend_tkagg" \
            main.py

      - name: Test packaged application
        run: '"dist/Pharmacology CAL.app/Contents/MacOS/Pharmacology CAL" --smoke-test'

      - name: Sign and verify application
        run: |
          codesign --force --deep --sign - "dist/Pharmacology CAL.app"
          codesign --verify --deep --strict --verbose=2 "dist/Pharmacology CAL.app"

      - name: Prepare download and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Pharmacology CAL.app" \
            "$ARCHIVE_NAME"
          shasum -a 256 "$ARCHIVE_NAME" > "$CHECKSUM_NAME"
          test -s "$ARCHIVE_NAME"
          test -s "$CHECKSUM_NAME"

      - name: Save workflow copy
        uses: actions/upload-artifact@v4
        with:
          name: Pharmacology CAL macOS Public Beta
          if-no-files-found: error
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.CHECKSUM_NAME }}

      - name: Replace files in the public beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE_NAME" \
            "$CHECKSUM_NAME" \
            --clobber
