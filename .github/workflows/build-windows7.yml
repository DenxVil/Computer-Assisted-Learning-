name: Build Windows 7 Legacy Public Beta

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "experiments/**"
      - "ui/**"
      - "integrated_modules/**"
      - "assets/**"
      - "requirements-windows7.txt"
      - ".github/workflows/build-windows7.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows7-legacy-public-beta-release
  cancel-in-progress: true

env:
  RELEASE_TAG: v1.0.0-beta.1
  APP_BASENAME: Pharmacology_CAL_Windows_7_Legacy_Beta_v1.0
  CHECKSUM_NAME: Pharmacology_CAL_Windows_7_Legacy_Beta_v1.0_SHA256.txt

jobs:
  build:
    # GitHub retired windows-2019 in June 2025. Python 3.8, Qt 5 and the
    # pinned legacy dependencies are therefore built on the oldest available
    # hosted Windows image. The result still requires testing on Windows 7 SP1.
    runs-on: windows-2022

    steps:
      - name: Get source files
        uses: actions/checkout@v5

      - name: Set up legacy Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows7.txt

      - name: Install pinned legacy build packages
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip==24.0"
          python -m pip install --disable-pip-version-check -r requirements-windows7.txt

      - name: Check Python files with Python 3.8
        run: python -m compileall -q main.py experiments ui integrated_modules

      - name: Build Windows 7 legacy application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name $env:APP_BASENAME `
            --icon "assets\mamc_logo.ico" `
            --add-data "assets;assets" `
            --collect-submodules "integrated_modules.frog_rectus" `
            --hidden-import "matplotlib.backends.backend_tkagg" `
            main.py

      - name: Test packaged legacy application
        shell: pwsh
        run: |
          $artifact = Join-Path "dist" ($env:APP_BASENAME + ".exe")
          $process = Start-Process `
            -FilePath $artifact `
            -ArgumentList "--smoke-test" `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Prepare checksum
        shell: pwsh
        run: |
          $artifact = Join-Path "dist" ($env:APP_BASENAME + ".exe")
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Expected executable was not created: $artifact"
          }
          if ((Get-Item -LiteralPath $artifact).Length -le 0) {
            throw "Executable is empty: $artifact"
          }
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:APP_BASENAME).exe" | Set-Content -LiteralPath $env:CHECKSUM_NAME -Encoding ascii
          Get-Item -LiteralPath $artifact, $env:CHECKSUM_NAME | Format-Table Name, Length

      - name: Save workflow copy
        uses: actions/upload-artifact@v4
        with:
          name: Pharmacology CAL Windows 7 Legacy Public Beta
          if-no-files-found: error
          path: |
            dist/${{ env.APP_BASENAME }}.exe
            ${{ env.CHECKSUM_NAME }}

      - name: Replace files in the public beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG `
            "dist/$($env:APP_BASENAME).exe" `
            $env:CHECKSUM_NAME `
            --clobber
